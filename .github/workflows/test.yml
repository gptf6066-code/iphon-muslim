name: Emulator test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest -p iphon-muslim.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r iphon-muslim.apk && echo INSTALL_OK
            adb logcat -c
            adb shell am start -W -n tj.bikhon.iphonmuslim/.MainActivity
            sleep 8
            adb shell pidof tj.bikhon.iphonmuslim || echo NOT_RUNNING
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > errors.txt || true
            cat crash.txt
            grep -i -A30 "FATAL\|iphonmuslim" errors.txt | head -150 || true
