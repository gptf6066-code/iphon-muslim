name: Train gender model (FairFace, CC BY 4.0)
on:
  workflow_dispatch:
    inputs:
      arch:
        default: "large"
      epochs:
        default: "10"
      init_branch:
        default: ""
      lr:
        default: "1e-3"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q datasets onnx onnxruntime pillow numpy
          nproc; free -g
      - name: Previous weights
        if: inputs.init_branch != ''
        run: |
          git fetch -q --depth 1 origin ${{ inputs.init_branch }}
          git show FETCH_HEAD:gender_ff.onnx.pt > init.pt && ls -la init.pt
      - name: Train
        run: python training/train_gender.py --out gender_ff.onnx --arch ${{ inputs.arch }} --epochs ${{ inputs.epochs }} --lr ${{ inputs.lr }} --hours 5.1 --init init.pt
      - name: Publish model
        if: always()
        run: |
          mkdir -p out && cp gender_ff.onnx* out/ 2>/dev/null || true
          ls -la out
          cd out && git init -q && git checkout -q -b gender-model-${{ inputs.arch }}${{ inputs.init_branch != '' && '-ft' || '' }} && git add . && \
          git -c user.name=ci -c user.email=ci@example.com commit -qm "FairFace gender model" && \
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} gender-model-${{ inputs.arch }}${{ inputs.init_branch != '' && '-ft' || '' }}
